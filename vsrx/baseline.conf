# vSRX Baseline Configuration — Junos set format
# Paste ALL of these commands into the vSRX CLI after boot:
#
#   ssh ec2-user@<vsrx-mgmt-eip>
#   cli
#   configure
#   (paste everything below)
#   commit and-quit
#
# See vsrx/README.md for step-by-step instructions.
# ─────────────────────────────────────────────────────────────────────────────

# ── Interfaces ────────────────────────────────────────────────────────────────
# fxp0 (eth0) is auto-configured via DHCP by AWS on first boot.
# Only revenue interfaces need manual configuration.

set interfaces ge-0/0/0 unit 0 family inet address 10.0.1.254/24
set interfaces ge-0/0/1 unit 0 family inet address 10.0.2.254/24

# ── Routing ───────────────────────────────────────────────────────────────────
# Default route via untrust gateway (10.0.1.1 = AWS VPC router in untrust subnet)
# fxp0 uses its own management routing instance (separate from inet.0); no change needed.

set routing-options static route 0.0.0.0/0 next-hop 10.0.1.1

# ── Security Zones ────────────────────────────────────────────────────────────

set security zones security-zone untrust interfaces ge-0/0/0.0
set security zones security-zone untrust interfaces ge-0/0/0.0 host-inbound-traffic system-services ping
set security zones security-zone untrust screen untrust-screen

set security zones security-zone trust interfaces ge-0/0/1.0
set security zones security-zone trust interfaces ge-0/0/1.0 host-inbound-traffic system-services all

# ── Address Book ──────────────────────────────────────────────────────────────

set security address-book global address KALI 10.0.1.20/32
set security address-book global address WEBSERVER 10.0.2.100/32
set security address-book global address UNTRUST-NET 10.0.1.0/24
set security address-book global address TRUST-NET 10.0.2.0/24

# ── Screen (DoS/flood/anomaly protection — applied to untrust zone) ───────────
# All protections are defined here at baseline.
# During the demo, show screens OFF first (attack succeeds), then explain
# these settings are active and run the attack again to show it blocked.

set security screen ids-option untrust-screen description "Untrust zone attack screen"

# Port scan detection (Scenario 1)
set security screen ids-option untrust-screen tcp port-scan threshold 5000
set security screen ids-option untrust-screen udp port-scan threshold 5000
set security screen ids-option untrust-screen icmp address-sweep threshold 5000

# SYN flood / SYN proxy (Scenario 2)
set security screen ids-option untrust-screen tcp syn-flood alarm-threshold 1024
set security screen ids-option untrust-screen tcp syn-flood attack-threshold 200
set security screen ids-option untrust-screen tcp syn-flood source-threshold 100
set security screen ids-option untrust-screen tcp syn-flood destination-threshold 100
set security screen ids-option untrust-screen tcp syn-flood timeout 20

# ICMP flood + oversized/malformed ICMP (Scenario 3)
set security screen ids-option untrust-screen icmp flood threshold 1000
set security screen ids-option untrust-screen icmp large
set security screen ids-option untrust-screen icmp ping-death

# IP spoofing + malformed packets (Scenario 6)
set security screen ids-option untrust-screen ip spoofing
set security screen ids-option untrust-screen ip source-route-option
set security screen ids-option untrust-screen ip tear-drop
set security screen ids-option untrust-screen tcp land
set security screen ids-option untrust-screen tcp syn-fin
set security screen ids-option untrust-screen tcp no-flag

# ── Security Policy (untrust → trust) ────────────────────────────────────────
# Baseline: permit HTTP/HTTPS and SSH from untrust to web server.
# IDP policy is attached below — it inspects all permitted traffic.

set security policies from-zone untrust to-zone trust policy demo-policy match source-address any
set security policies from-zone untrust to-zone trust policy demo-policy match destination-address any
set security policies from-zone untrust to-zone trust policy demo-policy match application any
set security policies from-zone untrust to-zone trust policy demo-policy then permit application-services idp-policy demo-idp

# Return / trust-to-untrust policy
set security policies from-zone trust to-zone untrust policy return-traffic match source-address any
set security policies from-zone trust to-zone untrust policy return-traffic match destination-address any
set security policies from-zone trust to-zone untrust policy return-traffic match application any
set security policies from-zone trust to-zone untrust policy return-traffic then permit

# ── IDP Policy (SSH brute force + web app attacks) ────────────────────────────
# NOTE: Run IDP signature download BEFORE committing this config:
#   request security idp security-package download
#   request security idp security-package install
#   show security idp security-package-version   (wait for "Update successful")
#
# The IDP policy will not activate until signatures are installed.

# Rule 1: Block SSH brute force attempts (Scenario 4)
set security idp idp-policy demo-idp rulebase-ips rule SSH-Brute-Force match from-zone untrust to-zone trust
set security idp idp-policy demo-idp rulebase-ips rule SSH-Brute-Force match source-address any
set security idp idp-policy demo-idp rulebase-ips rule SSH-Brute-Force match destination-address any
set security idp idp-policy demo-idp rulebase-ips rule SSH-Brute-Force match attacks predefined-attack-groups "SSH - Critical"
set security idp idp-policy demo-idp rulebase-ips rule SSH-Brute-Force then action drop-connection
set security idp idp-policy demo-idp rulebase-ips rule SSH-Brute-Force then notification log-attacks

# Rule 2: Block web application attacks — nikto/sqlmap (Scenario 5)
set security idp idp-policy demo-idp rulebase-ips rule Web-Attacks match from-zone untrust to-zone trust
set security idp idp-policy demo-idp rulebase-ips rule Web-Attacks match source-address any
set security idp idp-policy demo-idp rulebase-ips rule Web-Attacks match destination-address any
set security idp idp-policy demo-idp rulebase-ips rule Web-Attacks match attacks predefined-attack-groups "HTTP - Critical"
set security idp idp-policy demo-idp rulebase-ips rule Web-Attacks then action drop-connection
set security idp idp-policy demo-idp rulebase-ips rule Web-Attacks then notification log-attacks

# Rule 3: Block SQL injection (Scenario 5)
set security idp idp-policy demo-idp rulebase-ips rule SQL-Injection match from-zone untrust to-zone trust
set security idp idp-policy demo-idp rulebase-ips rule SQL-Injection match source-address any
set security idp idp-policy demo-idp rulebase-ips rule SQL-Injection match destination-address any
set security idp idp-policy demo-idp rulebase-ips rule SQL-Injection match attacks predefined-attack-groups "SQL - Critical"
set security idp idp-policy demo-idp rulebase-ips rule SQL-Injection then action drop-connection
set security idp idp-policy demo-idp rulebase-ips rule SQL-Injection then notification log-attacks

set security idp active-policy demo-idp

# ── Logging ───────────────────────────────────────────────────────────────────

set security log mode stream
set security log format sd-syslog
set system syslog file security-log any info
set system syslog file security-log structured-data
