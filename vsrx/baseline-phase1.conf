# vSRX Phase 1 — Everything except IDP
# Apply this first, verify SSH + interfaces + traffic flow work, THEN apply phase 2.
#
#   configure
#   (paste below)
#   commit and-quit
#
# Verify before proceeding to phase 2:
#   show interfaces terse              (ge-0/0/0.0 and ge-0/0/1.0 must be up)
#   show security screen ids-option untrust-screen
#   show security policies
#   ping 10.0.2.100 from Kali         (traffic must flow through vSRX)

# ── Interfaces ────────────────────────────────────────────────────────────────

set interfaces ge-0/0/0 unit 0 family inet address 10.0.1.254/24
set interfaces ge-0/0/1 unit 0 family inet address 10.0.2.254/24

# ── Routing ───────────────────────────────────────────────────────────────────

set routing-options static route 0.0.0.0/0 next-hop 10.0.1.1

# ── Security Zones ────────────────────────────────────────────────────────────

set security zones security-zone untrust interfaces ge-0/0/0.0
set security zones security-zone untrust interfaces ge-0/0/0.0 host-inbound-traffic system-services ping
set security zones security-zone untrust screen untrust-screen

set security zones security-zone trust interfaces ge-0/0/1.0
set security zones security-zone trust interfaces ge-0/0/1.0 host-inbound-traffic system-services all

# ── Address Book ──────────────────────────────────────────────────────────────

set security address-book global address KALI 10.0.1.20/32
set security address-book global address WEBSERVER 10.0.2.100/32
set security address-book global address UNTRUST-NET 10.0.1.0/24
set security address-book global address TRUST-NET 10.0.2.0/24

# ── Screen ────────────────────────────────────────────────────────────────────

set security screen ids-option untrust-screen description "Untrust zone attack screen"

set security screen ids-option untrust-screen tcp port-scan threshold 5000
set security screen ids-option untrust-screen udp port-scan threshold 5000
set security screen ids-option untrust-screen icmp address-sweep threshold 5000

set security screen ids-option untrust-screen tcp syn-flood alarm-threshold 1024
set security screen ids-option untrust-screen tcp syn-flood attack-threshold 200
set security screen ids-option untrust-screen tcp syn-flood source-threshold 100
set security screen ids-option untrust-screen tcp syn-flood destination-threshold 100
set security screen ids-option untrust-screen tcp syn-flood timeout 20

set security screen ids-option untrust-screen icmp flood threshold 1000
set security screen ids-option untrust-screen icmp large
set security screen ids-option untrust-screen icmp ping-death

set security screen ids-option untrust-screen ip spoofing
set security screen ids-option untrust-screen ip source-route-option
set security screen ids-option untrust-screen ip tear-drop
set security screen ids-option untrust-screen tcp land
set security screen ids-option untrust-screen tcp syn-fin
set security screen ids-option untrust-screen tcp no-flag

# ── Security Policy ───────────────────────────────────────────────────────────
# NOTE: IDP not attached yet — added in phase 2 once the system is stable.

set security policies from-zone untrust to-zone trust policy demo-policy match source-address any
set security policies from-zone untrust to-zone trust policy demo-policy match destination-address any
set security policies from-zone untrust to-zone trust policy demo-policy match application any
set security policies from-zone untrust to-zone trust policy demo-policy then permit

set security policies from-zone trust to-zone untrust policy return-traffic match source-address any
set security policies from-zone trust to-zone untrust policy return-traffic match destination-address any
set security policies from-zone trust to-zone untrust policy return-traffic match application any
set security policies from-zone trust to-zone untrust policy return-traffic then permit

# ── Logging ───────────────────────────────────────────────────────────────────

set security log mode stream
set security log format sd-syslog
set system syslog file security-log any info
set system syslog file security-log structured-data
